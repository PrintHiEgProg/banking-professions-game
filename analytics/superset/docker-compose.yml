# Superset для дашборда «Профессии в Банке — HR-аналитика».
#   docker compose up -d        → http://localhost:8088  (логин admin / пароль из ADMIN_PASSWORD, по умолчанию admin — смени!)
# Потом один раз: python bootstrap.py --superset http://localhost:8088 --db "$DATABASE_URL"
services:
  superset:
    build: .
    image: professii-superset:4.1.2
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-to-a-long-random-string}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_METADATA_URI: sqlite:////app/superset_home/superset.db
      SUPERSET_PUBLIC: ${SUPERSET_PUBLIC:-0}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset_home:/app/superset_home
    command:
      - bash
      - -c
      - |
        superset db upgrade &&
        (superset fab create-admin --username admin --firstname HR --lastname Bank --email hr@example.com --password "$$ADMIN_PASSWORD" || true) &&
        superset init &&
        /usr/bin/run-server.sh
    restart: unless-stopped
volumes:
  superset_home:
