# Superset на своём сервере (VPS) со своим доменом и HTTPS — например, https://stats.твой-домен.ru
# Игра остаётся на Vercel. Superset и игру связывает только база Postgres (DATABASE_URL).
#
#   cp .env.example .env && nano .env        # домен, пароли, адрес базы
#   docker compose -f docker-compose.vps.yml up -d --build
#   docker compose -f docker-compose.vps.yml exec superset python /app/analytics/superset/bootstrap.py --public
#
# Или всё сразу: bash setup-vps.sh  (подробно — analytics/README.md, раздел «Где поднять Superset»)
services:
  superset:
    build: .
    image: professii-superset:4.1.2
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?впиши SUPERSET_SECRET_KEY в .env}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      # Метаданные Superset (пользователи, дашборды). По умолчанию — файл на диске сервера;
      # можно вынести в отдельную базу Postgres: SUPERSET_METADATA_URI=postgresql+psycopg2://…
      SUPERSET_METADATA_URI: ${SUPERSET_METADATA_URI:-sqlite:////app/superset_home/superset.db}
      SUPERSET_PUBLIC: ${SUPERSET_PUBLIC:-0}
      SUPERSET_PROXY_FIX: "1" # за Caddy: Superset понимает, что снаружи HTTPS
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?впиши ADMIN_PASSWORD в .env}
      DATABASE_URL: ${DATABASE_URL:-}
      SUPERSET_URL: http://localhost:8088
      SUPERSET_PASSWORD: ${ADMIN_PASSWORD}
      SERVER_WORKER_AMOUNT: ${SERVER_WORKER_AMOUNT:-2}
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - ../:/app/analytics:ro # bootstrap.py + schema.sql + views.sql
      - superset_home:/app/superset_home
    command:
      - bash
      - -c
      - |
        superset db upgrade &&
        (superset fab create-admin --username admin --firstname HR --lastname Bank --email hr@example.com --password "$$ADMIN_PASSWORD" || true) &&
        superset fab reset-password --username admin --password "$$ADMIN_PASSWORD" &&
        superset init &&
        /usr/bin/run-server.sh
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    # наружу не открыт: весь трафик идёт через Caddy (HTTPS)

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?впиши DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # сертификаты Let's Encrypt
      - caddy_config:/config
    depends_on:
      - superset
    restart: unless-stopped

volumes:
  superset_home:
  caddy_data:
  caddy_config:
